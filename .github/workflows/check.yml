# Quality gate on every push and pull request (docs/03-retrieval-pipeline.md §11.2).
# No secrets and no network in tests, so it runs the same on forks' pull requests.
name: check

on:
  push:
    # Every branch but the deployed site. `gh-pages` holds a build product and no source, so the
    # gate could only fail on it — and it is pushed by hand during a rollback (docs/07 §8), which
    # would otherwise send the maintainer a failure email for doing the documented thing.
    branches-ignore: ["gh-pages"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov=uwpr_pubs --cov-report=term-missing
      - run: uv run uwpr-pubs validate store          # the committed store (seeded 2026-09-20)
      - run: uv run uwpr-pubs validate samples/store
      - run: uv run uwpr-pubs fixtures --store store  # the Phase 1 §12 papers, offline
      # `export/` is committed (docs/02 §3) and is what the site serves, so it must never drift
      # from the store and config it was built from. Rebuilding it is deterministic — every
      # field comes from the store's own latest run manifest — so a diff is the whole check.
      # If this fails: `uv run uwpr-pubs export --store store --out export` and commit.
      - name: The committed export matches the committed store
        run: |
          uv run uwpr-pubs export --store store --out "$RUNNER_TEMP/export"
          diff -r "$RUNNER_TEMP/export" export

  # The web app's gate (docs/06 §12.3). Independent of `check`: both must pass.
  # Playwright and the visual-regression pass of §12.2 arrive with the views they cover.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci                    # from the committed lockfile, exactly (docs/06 §11.1)
      - run: npm run check:types-fresh # contract drift is a build failure, not a broken page (B3)
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage     # unit and component tests, 80% floor (B7)
      - run: npm run build
      - run: npm run check:budget      # JS ≤ 250 KB gzipped; the job fails on an overrun (§10)
      # End to end, against the built app behind `vite preview`. The routing behaviours these
      # cover — the 404 fallback and the on-demand lookup fetch — do not exist in dev, so a
      # component test cannot reach them (docs/06 §12.2).
      - run: npm run e2e:install
      - run: npm run e2e
