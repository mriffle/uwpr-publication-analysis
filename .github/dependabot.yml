# Keeps the SHA-pinned actions current (docs/03-retrieval-pipeline.md §11.1), and the app's npm
# and the pipeline's Python dependencies current (docs/07-operations.md O8, §11).
#
# Monthly for all three. The pull requests are also the project's insurance against docs/07 §12's
# first risk: GitHub disables a scheduled workflow after a period of repository inactivity, and
# whether the bot's own pushes count is not established. A monthly human-facing pull request is.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # pyproject.toml and uv.lock. uv itself is not a dependency here: its version is pinned by
  # `[tool.uv] required-version` in pyproject.toml, and moved by hand (RUNBOOK §11).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /web # package.json and package-lock.json live in web/ (docs/06 B11)
    schedule:
      interval: monthly
    ignore:
      # @types/node describes the Node the app is built and tested on: the major in web/.nvmrc
      # (24). Raise this bound together with .nvmrc, never ahead of it (#2 proposed 26).
      - dependency-name: "@types/node"
        versions: [">=25"]
      # ESLint 10 waits for eslint-plugin-jsx-a11y, whose latest (6.10.2) allows eslint <= 9 only
      # (jsx-eslint/eslint-plugin-jsx-a11y#1075). @eslint/js 10 declares a peer on eslint ^10, so
      # on its own (#5) it made every `npm install` fail with ERESOLVE while `npm ci`, and so CI,
      # stayed green. Remove both entries together.
      - dependency-name: "eslint"
        versions: [">=10"]
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      # typescript-eslint (8.70.1, the latest) supports typescript < 6.1.0, so TypeScript 7 (#11)
      # failed `npm ci` with ERESOLVE. Remove this when typescript-eslint's peer range widens.
      - dependency-name: "typescript"
        versions: [">=6.1"]
    groups:
      # Released together from one repository, and @eslint/js N declares a peer on eslint N.
      eslint:
        patterns:
          - "eslint"
          - "@eslint/js"
      # @vitest/coverage-v8 N pins vitest N exactly, so vitest alone (#8) failed `npm ci`.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
