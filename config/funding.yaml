# Funding impact (docs/09 §6-§8.4). Schema: schemas/config/funding.schema.json
#
# ANY change to this file needs a new funding_version, or stage 0 fails the run; a new version
# schedules a full refresh (docs/09 §8.4). Grant overrides live in overrides.yaml and need no bump
# (§6.6); exchange rates live in exchange_rates.yaml, outside the fingerprint. The resource code,
# which is never a grant (F1), is rules.yaml's r2.code and is not repeated here. Patterns are Python
# regexes, case-sensitive unless they start with (?i).
schema: 1
funding_version: "2026-09-26.3"
enabled: false                         # true only from the seed (B9); false means the stage is skipped

refresh:
  full_every_days: 28                  # a full refresh at least this often (§9.2)
  active_within_days: 365              # an incremental run refreshes grants active this recently
  recheck_unresolved_days: 90          # how long a miss is remembered before it is asked again
reporter:                              # NIH RePORTER's terms: large jobs at weekends or 21:00-05:00 Eastern
  window: {tz: America/New_York, weekend: true, weekday_hours: [21, 5]}
  weekday_request_cap: 60              # incremental requests allowed outside the window

# --- NIH (§6.2, §6.3, §11.4) -------------------------------------------------------------------
nih:
  # Every two-letter institute code RePORTER uses in a project number: NIH's list (RePORTER's data
  # elements, appendix II), historical codes (RR, the dissolved NCRR; RM, the Roadmap; CM and HV,
  # NCI's and NHLBI's contracts), the VA's research services (BX, CX, HX, RX: I01BX000531 is in
  # RePORTER) and AHRQ's HS. Only these parse as NIH numbers, so R21AO129851 does not: AO is none.
  ics: [AA, AG, AI, AR, AT, BX, CA, CC, CL, CM, CX, DA, DC, DE, DK, EB, ES, EY, GM, HD, HG, HL, HS, HV,
        HX, LM, MD, MH, NR, NS, OD, RG, RM, RR, RX, TR, TW]
  # A string naming either phase lists every phase RePORTER holds under that institute and serial.
  phase_pairs: [[K99, R00], [R21, R33], [R61, R33], [UH2, UH3], [UG3, UH3], [R01, R37]]
  # Activity code to category. An exact code wins over a prefix (CODE*), and a longer prefix over a
  # shorter one: R24 is a centre, R25 training, and every other R code research.
  categories:
    instrument: [S10, G20]
    training: [T*, F*, K*, R25, D43]
    center: [P*, M01, U54, U19, U24, U2C, U41, U42, UL1, R24]
    contract: [N*]
    research: [R*, RM1, DP*, U01, UH2, UH3, UG3, UM1, RF1, SC*, Z*, I01]

# --- Agencies (§6.4, §6.8-6.10) -----------------------------------------------------------------
# A string belongs to an agency its sources name by funder ID (an OpenAlex funder, a Crossref
# funder DOI) or by PubMed's Agency. The IDs were mined from the research's OpenAlex, Crossref and
# PubMed records of 2026-09-26. A funder's name counts only where its source gives no ID (a
# Crossref funder entry without a registry DOI), and only matched whole against funder_names:
# patterns written casefolded, compared with the name casefolded, whitespace collapsed and the
# punctuation around it trimmed. NIH, HHS and PHS never have them (§6.4). number_prefixes are
# stripped from the front of a number (with labels such as "grants" or "No."); number_pattern,
# when set, is what a normalised number of that agency must look like, which also settles a string
# several agencies are named for. year_prefix expands a two-digit year at the front of a number
# (FAPESP).
agencies:
  # NIH: its institutes, HHS and PHS count as NIH attribution (§6.4). The institutes themselves
  # are learned from RePORTER, as each grant's administering IC.
  - code: NIH
    name: National Institutes of Health
    short_name: NIH
    group: us_federal
    country: "US"
    amount_source: reporter
    openalex_funders: [F4320332161, F4320337351, F4320337472, F4320337593, F4320337375, F4320337350,
                       F4320337338, F4320337348, F4320337355, F4320337362, F4320337363, F4320337365,
                       F4320337357, F4320337361, F4320337354, F4320337346, F4320337359, F4320337353,
                       F4320337337, F4320337347, F4320337611, F4320337364, F4320337349, F4320337544,
                       F4320337901, F4320337372, F4320309123, F4320338412, F4320338421, F4320337432,
                       F4320306085, F4320332505]
    crossref_funder_dois: [10.13039/100000002, 10.13039/100000025, 10.13039/100000026, 10.13039/100000049,
                           10.13039/100000050, 10.13039/100000051, 10.13039/100000052, 10.13039/100000053,
                           10.13039/100000054, 10.13039/100000056, 10.13039/100000057, 10.13039/100000060,
                           10.13039/100000062, 10.13039/100000065, 10.13039/100000066, 10.13039/100000069,
                           10.13039/100000070, 10.13039/100000072, 10.13039/100000092, 10.13039/100000097,
                           10.13039/100005440, 10.13039/100006108, 10.13039/100006492, 10.13039/100006955,
                           10.13039/100008460, 10.13039/100009633, 10.13039/100015691, 10.13039/100016958,
                           10.13039/100017540, 10.13039/100000016, 10.13039/100007197]
    # "NIGMS NIH HHS", "PHS HHS", and the institutes' own names. Not "National Institute(s) of" in
    # general: that is also the National Institute of Food and Agriculture (USDA).
    pubmed_agency_patterns:
      - '\b(?:NIH|HHS|PHS)\b'
      - '^National (?:Cancer|Eye|Human Genome Research|Heart, Lung,? and Blood) Institute$'
      - '^National Institutes? (?:on|of) (?:Aging|Alcohol Abuse and Alcoholism|Allergy and Infectious Diseases|Arthritis and Musculoskeletal and Skin Diseases|Biomedical Imaging and Bioengineering|Deafness and Other Communication Disorders|Dental and Craniofacial Research|Diabetes and Digestive and Kidney Diseases|Drug Abuse|Environmental Health Sciences|General Medical Sciences|Mental Health|Minority Health and Health Disparities|Neurological Disorders and Stroke|Nursing Research)$'
      - '^National Institutes of Health$'
    number_prefixes: []
    number_pattern: null
    year_prefix: false

  # US federal: keyed USA:<AGENCY>:<NUMBER>, valued by USAspending (§6.9).
  - code: NSF
    name: National Science Foundation
    short_name: NSF
    group: us_federal
    country: "US"
    amount_source: nsf
    # With its divisions and C-DEBI, an NSF Science and Technology Center that is named as a funder;
    # and two other "NSF"s the funder registry offers, the National Sleep Foundation and Norway's
    # nurses' union, which publishers chose for NSF's own numbers (1922871, 1933311 on W-000222).
    # A number named for them is still an NSF number only if the NSF API knows it.
    openalex_funders: [F4320306076, F4320337399, F4320337398, F4320337386, F4320332167, F4320337393,
                       F4320337368, F4320314327, F4320307381, F4320322435]
    crossref_funder_dois: [10.13039/100000001, 10.13039/100000154, 10.13039/100000153, 10.13039/100000141,
                           10.13039/100000076, 10.13039/100000165, 10.13039/100000082, 10.13039/100013505,
                           10.13039/100003187, 10.13039/501100004190]
    pubmed_agency_patterns:
      - '^National Science Foundation\b'
      - '^(?:Division of Integrative Organismal Systems|Directorate for Biological Sciences|Center for Dark Energy Biosphere Investigations)$'
    # "NSF" without an ID names OCE 1633939 on W-000184, and "National Science Foundation Graduate
    # Research Fellowship Program" (Crossref gives its ROR, not a registry DOI) DGE-2140004 on
    # W-000014. Whole names only: not the Swiss National Science Foundation, nor the National
    # (Natural) Science Foundation of China, nor a fellowship that does not say it is NSF's.
    funder_names: ['(?:u\.?s\.? )?national science foundation(?: \(nsf\))?', 'nsf',
                   '(?:(?:u\.?s\.? )?national science foundation(?: \(nsf\))?|nsf) graduate research fellowships?(?: program(?:me)?)?(?: \((?:nsf[ -])?grfp\))?',
                   'nsf[ -]grfp']
    number_prefixes: [NSF-CDEBI, NSF]
    number_pattern: '[0-9]{7}'             # §6.8: seven digits once the division prefix is removed
    year_prefix: false
    categories:                            # §11.4, on the NSF API's programme and award type
      default: research
      match:
        - {category: training, field: programme, pattern: '(?i)graduate research fellowship'}
        - {category: training, field: type, pattern: '(?i)^fellowship award$'}
        - {category: center, field: programme, pattern: '\bSTCs?\b'}
  - code: NASA
    name: National Aeronautics and Space Administration
    short_name: NASA
    group: us_federal
    country: "US"
    amount_source: usaspending
    openalex_funders: [F4320306101, F4320331934]
    crossref_funder_dois: [10.13039/100000104, 10.13039/100012627]
    pubmed_agency_patterns: ['\bNASA\b']
    number_prefixes: []
    number_pattern: null
    year_prefix: false
