    openalex_funders: [F4320306084, F4320332359, F4320337480, F4320337509, F4320338289, F4320338284,
                       F4320338354]
    crossref_funder_dois: [10.13039/100000015, 10.13039/100006132, 10.13039/100006151, 10.13039/100006206,
                           10.13039/100006231, 10.13039/100006224, 10.13039/100011661]
    pubmed_agency_patterns: []
    number_prefixes: [DOE]
    number_pattern: null
    year_prefix: false
  - code: DOD
    name: U.S. Department of Defense
    short_name: DoD
    group: us_federal
    country: "US"
    amount_source: usaspending
    # DTRA, and IARPA (ODNI), whose TEI-REX awards are Army Research Office instruments (W911NF…).
    openalex_funders: [F4320332186, F4320333051, F4320312530]
    crossref_funder_dois: [10.13039/100000774, 10.13039/100011039, 10.13039/100011038]
    pubmed_agency_patterns: ['Intelligence Advanced Research Projects Activity', '^Defense Threat Reduction Agency$']
    number_prefixes: []
    number_pattern: null
    year_prefix: false
  - code: NOAA
    name: National Oceanic and Atmospheric Administration
    short_name: NOAA
    group: us_federal
    country: "US"
    amount_source: usaspending
    openalex_funders: [F4320332181, F4320332292]      # with Washington Sea Grant, its programme at UW
    crossref_funder_dois: [10.13039/100000192, 10.13039/100005799]
    pubmed_agency_patterns: ['^National Oceanic and Atmospheric Administration$', '^Washington Sea Grant']
    # "Washington Sea Grant Award" without an ID names NA140AR4170078 on W-000274.
    funder_names: ['national oceanic and atmospheric administration(?: \(noaa\))?', 'noaa',
                   'washington sea grant(?: award| program)?(?:, university of washington)?']
    number_prefixes: []
    # NOAA's award numbers: NA, the year, a line office (O written for 0 tolerated) and a serial.
    # Washington Sea Grant's internal project number R/SFA-8 is not one (Appendix A.6).
    number_pattern: 'NA[0-9]{2}[A-Z0-9]{3}[0-9]{4,7}'
    year_prefix: false
  - code: DOI
    name: U.S. Department of the Interior
    short_name: DOI
    group: us_federal
    country: "US"
    amount_source: usaspending
    openalex_funders: [F4320306116, F4320333318]      # with its Bureau of Ocean Energy Management
    crossref_funder_dois: [10.13039/100000201, 10.13039/100012475]
    pubmed_agency_patterns: []
    number_prefixes: []
    number_pattern: null
    year_prefix: false
  - code: USDA
    name: U.S. Department of Agriculture
    short_name: USDA
    group: us_federal
    country: "US"
    amount_source: usaspending
    openalex_funders: [F4320306114, F4320332299]      # with the National Institute of Food and Agriculture
    crossref_funder_dois: [10.13039/100000199, 10.13039/100005825]
    pubmed_agency_patterns: ['\bUSDA\b', '^National Institute of Food and Agriculture$']
    number_prefixes: []
    number_pattern: null
    year_prefix: false
  - code: VA
    name: U.S. Department of Veterans Affairs
    short_name: VA
    group: us_federal
    country: "US"
    amount_source: usaspending                        # its RePORTER projects are keyed VA:<core>
    openalex_funders: [F4320306127]
    crossref_funder_dois: [10.13039/100000738]
    pubmed_agency_patterns: ['\bVA\b']
    number_prefixes: []
    number_pattern: null
    year_prefix: false

