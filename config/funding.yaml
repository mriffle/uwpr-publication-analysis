# --- Facility contracts (§6.14, Appendix C) ----------------------------------------------------
# DOE national-laboratory operating (M&O) contracts, cited for facility use: excluded (F5). Matched
# by number, or by the distinctive tail they are written with, O for 0 and separators tolerated;
# the DE-AC pattern catches any other, and fragments such as DE-AC02.
facility_contracts:
  - {number: DE-AC02-05CH11231, tails: [05CH11231], reason: Lawrence Berkeley National Laboratory's operating contract}
  - {number: DE-AC02-06CH11357, tails: [06CH11357], reason: Argonne National Laboratory's operating contract}
  - {number: DE-AC05-76RL01830, tails: [76RL01830], reason: Pacific Northwest National Laboratory's operating contract}
  - {number: DE-SC0012704, tails: [SC0012704], reason: Brookhaven National Laboratory's operating contract}
  - {pattern: '(?<![A-Z0-9])DE[ -]*AC(?![A-Z])', reason: a DOE management and operating contract}

# --- Institution-wide awards (§6.15, F4, Appendix B) -------------------------------------------
institution_wide:
  keys:
    - {key: "ANID:15130011", reason: FONDAP centre}
    - {key: "ANID:1523A0008", reason: FONDAP centre}
    - {key: "ANID:FB210008", reason: Basal centre}
    - {key: "ANR:ANR10IAHU0001", reason: IHU institute}
    - {key: "ANR:ANR10LABX0062", reason: LabEx}
    - {key: "EU:101080544", reason: EU consortium total}
    - {key: "EU:101103253", reason: EU consortium total}
    - {key: "EU:101195186", reason: EU consortium total}
    - {key: "EU:115760", reason: IMI consortium}
    - {key: "EU:115766", reason: IMI consortium (EU contribution; total cost €50.3M)}
    - {key: "EU:722493", reason: EU consortium total}
    - {key: "EU:733032", reason: EU consortium total}
    - {key: "EU:823839", reason: EU consortium total}
    - {key: "VR:201900217", reason: national infrastructure}
    - {key: "WT:092809Z10Z", reason: SGC consortium}
    - {key: "USA:NASA:NCC958", reason: NSBRI institute cooperative agreement}
    - {key: "USA:NASA:NNX16AO69A", reason: TRISH institute agreement}
    - {key: "USA:NOAA:NA14OAR4170078", reason: Washington Sea Grant omnibus award}
    - {key: "NSF:0718124", reason: NSF GRFP institutional award}
    - {key: "NSF:0939564", reason: NSF Science and Technology Center (C-DEBI)}
    - {key: "NSF:1256082", reason: NSF GRFP institutional award}
    - {key: "NSF:1762114", reason: NSF GRFP institutional award}
    - {key: "NSF:2140004", reason: NSF GRFP institutional award}
  # Matched on the NSF API's programme name. A fellowship to one person is not institution-wide.
  nsf_programmes:
    - {name: GRFP, pattern: '(?i)graduate research fellowship', reason: NSF GRFP institutional award}
    - {name: STC, pattern: '\bSTCs?\b|(?i:science (?:and|&) technology cent)', reason: NSF Science and Technology Center}

# --- Not grants (§6.12, Appendix A.6) ----------------------------------------------------------
# Each matches the whole string after list splitting, never a part: K99/R00 is a mechanism name,
# `K99/R00 1K99HL103768-01` a grant. Strings are compared ignoring case, spaces and dashes.
not_grants:
  - {pattern: '[^0-9]*', reason: 'no number: a programme or mechanism name'}
  - {pattern: '(?:.*?[\s/.])?(?:10\.)?13039(?:[/.].*)?', reason: a Crossref funder ID or a fragment of one}
  - {pattern: '5011000[0-9]{5}', reason: a Crossref funder ID without its prefix}
  - {string: AEI/10, reason: a fragment of a Crossref funder ID}
  - {pattern: '(?i)(?:RRID:\s*)?(?:SCR|AB|CVCL|IMSR)_[0-9]+', reason: an RRID}
  - {pattern: '(?:19|20)[0-9]{2}\s*-?', reason: a year}
  - {pattern: '(?:19|20)[0-9]{2}\s*-\s*(?:19|20)[0-9]{2}', reason: a year range}
  - {string: N/A, reason: not applicable}
  - {string: NA, reason: not applicable}
  - {string: PGT121, reason: an HIV antibody name}
  - {string: PGT145, reason: an HIV antibody name}
  - {string: PGDM1400, reason: an HIV antibody name}
  - {string: 35O22, reason: an HIV antibody name}
  - {string: NIH-R01, reason: 'a mechanism name, no number'}
  - {string: K99/R00, reason: 'a mechanism name, no number'}
  - {string: K99-R00, reason: 'a mechanism name, no number'}
  - {string: H2020, reason: a programme name}
  - {string: HORIZON2020, reason: a programme name}
  - {string: '-0001', reason: a fragment of the DTRA number on the same works}
  - {string: Z/17/Z, reason: a fragment of a Wellcome number}
  - {string: Project 3, reason: a sub-project label}

# --- Amounts (§7) --------------------------------------------------------------------------------
openalex_amounts:
  exclude_provenance: [gepris]         # DFG's GEPRIS: two unrelated grants carry an identical €109,941.6654
  corrections:
    - {provenance: anid_github, multiply: 1000, reason: "ANID states thousands of pesos (M$); OpenAlex labels them pesos"}
large_award_review_usd: 20000000      # untagged awards this large are listed for review (§6.15)
total_drop_alert: 0.05                # alert when the total falls by more than this, undegraded (§9.5)
