# Exchange rates (docs/09 §7.2, F7). Schema: schemas/config/exchange_rates.schema.json
#
# US dollars per unit of each currency, the annual average of each year, as decimal strings. A
# non-USD amount is converted at its award's start year's rate (docs/09 §7.2). This file is
# outside the funding fingerprint: a new or corrected rate needs no funding_version bump, and the
# next run recomputes every amount from it. It is updated each January, when the Federal Reserve
# publishes the year before (RUNBOOK).
#
# Federal Reserve G.5A quotes the Australian dollar, euro, New Zealand dollar and pound in US
# dollars per unit, and they are stored as quoted. It quotes every other currency in units per US
# dollar; those are stored inverted, computed in decimal and rounded to ten significant digits,
# halves to even. For each year the latest release that reports it is used: releases revise the
# years before, and from 2021 give four decimal places where earlier ones gave two or three.
# G.5A's Venezuelan bolivar is left out: one series spans four currencies (VEB, VEF, VES and VED,
# redenominated in 2008, 2018 and 2021), so no single ISO code names it, and an amount in bolivars
# is left unconverted, as any currency neither table covers is.
#
# OECD's annual average exchange rates (national currency per US dollar, EXC_A) supply every
# currency OECD publishes that G.5A lacks, inverted in the same way; the Chilean peso is the only
# one the corpus has needed (docs/09 Appendix D). OECD gives Kazakhstan's and Peru's series no
# currency code; they are the tenge (KZT) and the sol (PEN). OECD reports the euro area's members,
# and Bulgaria and Croatia, in euros, so the lev and the kuna are not here; the euro is G.5A's.
schema: 1
