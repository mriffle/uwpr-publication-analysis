# Pipeline settings (docs/03-retrieval-pipeline.md §10.1). Schema: schemas/config/settings.schema.json
schema: 1
contact: mriffle@uw.edu              # sent to APIs as mailto/email (public); fixed by project rule
window_start: 2006                   # Phase 1 D4
resource:                            # what the app names; the app holds no UWPR text of its own (docs/05 §1.1)
  name: University of Washington Proteomics Resource
  short_name: UWPR
  url: https://proteomicsresource.washington.edu/
  # The facility's own institution and country, stated rather than inferred (docs/05 §7.8, §7.14).
  # The institution chart excludes the first and the geography section counts "outside" the
  # second; both are facts about this facility, so the app must be told them, not guess from
  # frequency. Measured against the committed store on 2026-09-20: this ROR is on 316 of 339
  # works and US on 322.
  home_institution: {ror: 00cvxb145, name: University of Washington}   # as OpenAlex names it
  home_country: US                   # ISO 3166-1 alpha-2
  # What is deliberately not evidence, named (docs/05 §10). The method page describes the
  # exclusions in kind; principle 5 forbids it naming any of them itself, so the names come from
  # here. This list restates in public terms what config/rules.yaml already excludes — the two
  # `signals.cores` patterns, and the `r3.exclusions` software, tool, hardware and other_org
  # groups — so a rule change that adds an exclusion adds it here too.
  #
  # Register (docs/05 §11, and §10's note of 2026-09-20): factual, no judgement. These are
  # separate facilities whose work is not this resource's, not lesser ones, and the software is
  # freely available to anyone, which is exactly why using it is not use of the facility.
  exclusions:
    - kind: facility
      name: Quantitative and Functional Proteomics Core, UW Diabetes Research Center
      note: >-
        At the University of Washington's Diabetes Research Center. Publications it supported are
        not counted here unless UWPR also supported them.
    - kind: facility
      name: Mass Spectrometry Resource, UW Department of Medicine
      note: >-
        In the University of Washington's Department of Medicine, in use since at least 1995 and
        often used by the same research groups. Publications it supported are not counted here
        unless UWPR also supported them.
    - kind: facility
      name: Proteomics Resource, Fred Hutchinson Cancer Center
      note: >-
        In Seattle, and named almost exactly as this project's searches are worded. A publication
        naming it and not UWPR is not counted here.
    - kind: software
      name: Comet
      note: An open-source sequence-database search engine that any group can download and run.
    - kind: software
      name: SEQUEST
      note: >-
        A sequence-database search engine distributed with commercial instrument software, and
        used far beyond this facility.
    - kind: software
      name: Kojak
      note: >-
        An open-source search engine for cross-linked peptides, downloaded and run by whoever
        needs it.
    - kind: software
      name: Hardklor
      note: >-
        An open-source program for finding peptide isotope distributions in mass spectra,
        downloaded and run by whoever needs it.
    - kind: software
      name: Limelight
      note: >-
        An open-source web application for analysing and sharing proteomics results, which any
        group can install on its own servers.
    - kind: software
      name: Lorikeet
      note: >-
        An open-source viewer for annotated peptide spectra, which any site can embed in its own
        pages.
    - kind: tool
      name: The online peptide fragmentation calculator
      note: A public web page that works out the fragment masses of a peptide sequence.
    - kind: hardware
      name: The nanospray source design
      note: Plans on the resource's website that any workshop can follow.
official_list:
  index_url: https://proteomicsresource.washington.edu/publications/
  page_link_pattern: '^(?:https://proteomicsresource\.washington\.edu)?/publications/(?:[0-9]{4}|older)/$'
openalex: {max_run_usd: 0.50, min_remaining_usd: 0.10}
rate_limits:                         # requests per second (§7)
  ncbi: 3
  ncbi_with_key: 10
  europepmc: 5
  openalex: 5
  crossref: 5
  pride: 2
  biorxiv: 2
  uwpr_site: 1
max_attempts: 4                      # per request, with backoff (§7)
recheck_days: 90                     # unreadable text is looked for again after this (P9)
last_seen_refresh_days: 28           # P11
list_drop_tolerance: 0.10            # §5 stage 1
recall_baseline: {with_evidence: 201, assessable: 246}   # 82%, Phase 1 §4.2
recall_alert_points: 5               # §9
degraded_to_alert_after: 3           # §9
timezone_for_dates: UTC
