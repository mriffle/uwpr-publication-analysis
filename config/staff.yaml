# UWPR staff (docs/03-retrieval-pipeline.md §10.2; Phase 1 §5.1, §6.6). Schema: schemas/config/staff.schema.json
# Part of the rules fingerprint: any change here needs a new rule_version in rules.yaml (P15).
#
# name_patterns are case-sensitive regexes for the full-name forms of Phase 1 §6.6, allowing the
# spacing and capitalisation variants seen in print ("P.D. von Haller", "Van Haller") and the
# "von Haler" misspelling (Hal+er). A bare surname never counts.
# openalex lists verified author IDs only; a same-name "Vagisha Sharma" (A5068604239) is not staff.
schema: 1
staff:
  - key: eng
    name: Jimmy K. Eng
    name_patterns:
      - '\bJimmy (?:K\. )?Eng\b'
      - '\bJ\. ?K\. Eng\b'
    openalex: [A5011565192]
    orcid: 0000-0001-6352-6737
    tenure: {start: 2006, end: null}
  - key: riffle
    name: Michael Riffle
    name_patterns:
      - '\b(?:Michael|Mike) Riffle\b'
    openalex: [A5067746093, A5134114528]
    orcid: 0000-0003-1633-8607
    tenure: {start: 2006, end: null}
  - key: hoopmann
    name: Michael R. Hoopmann
    name_patterns:
      - '\bMichael (?:R\. )?Hoopmann\b'
    openalex: [A5018903678]
    orcid: 0000-0001-7029-7792
    tenure: {start: 2024, end: null}   # earlier work (e.g. at ISB) is not UWPR support
  - key: sharma
    name: Vagisha Sharma
    name_patterns:
      - '\bVagisha Sharma\b'
    openalex: [A5101918119]
    orcid: 0000-0003-1922-439X
    tenure: {start: 2006, end: null}
  - key: vonhaller
    name: Priska D. von Haller
    name_patterns:
      - '\bPriska (?:D\. ?)?[Vv][ao]n Hal+er\b'
      - '\bP\. ?(?:D\. ?)?[Vv]on Hal+er\b'
      - '\bDr\. [Vv]on Hal+er\b'
    openalex: [A5083225847, A5061349330]
    orcid: null
    tenure: {start: 2006, end: null}
