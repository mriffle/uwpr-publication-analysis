# Forced include/exclude, merge/split (docs/02-data-model.md §9).
#
# The only routine human input besides configuration. Overrides beat the rules, except R1: a
# paper on UWPR's publications page cannot be excluded (Phase 1 §6.0). Each entry names the
# person who decided and the date, because an override is a judgement, not a measurement.
# Targets are work IDs; `uwpr-pubs explain <DOI|PMID>` gives a paper's.
- target: [W-000329, W-000735]
  action: merge
  reason: >-
    Preprint and article of one piece of research, which no source links. Crossref gives the
    preprint only `is-version-of` pointing at its own v1 and the article's relation is empty;
    neither record's OpenAlex locations names the other; the titles score 0.645 against the 0.85
    threshold and the first authors differ, because the author order changed between versions.
    Same group at Umea, same finding. This is the pair docs/02 §9 was written around, and
    samples/store/ has linked it by override since Phase 2.
  by: mriffle
  date: 2026-09-20

# Reviewed 2026-09-20, against the works the rules found off the official list (docs/08 §3.3).
# 33 of the 35 were confirmed. This one is the only drop that no rule can express: the
# acknowledgement reads "for their excellent technical assistance", which is word for word what
# listed papers say when they credit real UWPR work, so narrowing R7 to exclude it would drop
# papers UWPR itself lists. The other drop became a rule change instead (01a C4, R7's deposition
# disqualifier), because its wording names the act.
- target: W-000686
  action: exclude
  reason: >-
    Reviewed: the staff member thanked here was not acting in a UWPR role. A bare credit for
    "excellent technical assistance", with no instrument, analysis or sample work named, is not
    evidence that the resource was used (Phase 1 §2.1, criterion 3).
  by: mriffle
  date: 2026-09-20

